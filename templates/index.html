<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='.35em' font-size='80'%3E📂%3C/text%3E%3C/svg%3E">
    <!-- <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='.35em' font-size='80'%3E📄%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <!-- <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' text-anchor='middle' dy='.35em' font-size='80'%3E💻%3C/text%3E%3C/svg%3E"> -->
    <title>Система сдачи работ</title>

    <style>
        /* ============================================================
           ТЁМНАЯ И СВЕТЛАЯ ТЕМЫ
        ============================================================ */
        :root {
            --bg: #f4f4f5;
            --card: #ffffff;
            --text: #111827;
            --input: #f3f4f6;
            --border: #d4d4d8;
            --accent: #f59e0b;
            --accent-hover: #ea580c;
        }

        body.dark {
            --bg: #12201e;
            --card: #26312f;
            --text: #f9fafb;
            --input: #375151;
            --border: #4b6360;
            --accent: #f97316;
            --accent-hover: #ea580c;
        }

        /* ============================================================
           БАЗОВЫЕ СТИЛИ И СБРОСЫ
        ============================================================ */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ============================================================
           ОСНОВНОЙ КОНТЕЙНЕР
        ============================================================ */
        .container {
            width: 650px;
            background: var(--card);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
            transition: 0.3s;
        }

        /* ============================================================
           ВЕРХНЯЯ ПАНЕЛЬ: ЗАГОЛОВОК И КНОПКА ТЕМЫ
        ============================================================ */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
        }

        .theme-button {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .theme-button:hover {
            background: var(--accent-hover);
        }

        .theme-icon {
            width: 30px;
            height: 30px;
            object-fit: contain;
            transition: 0.3s;
        }

        body.dark .theme-icon {
            filter: invert(1);
        }

        /* ============================================================
           ПОЛЯ ВВОДА И SELECT
        ============================================================ */
        input,
        select {
            width: 100%;
            padding: 18px;
            margin-bottom: 20px;
            border: none;
            border-radius: 16px;
            background: var(--input);
            color: var(--text);
            font-size: 17px;
            transition: 0.3s;
        }

        /* Фокус только оранжевый (без чёрного ободка) */
        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245,158,11,0.3);
        }

        /* Кастомный select со стрелкой */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg fill='%23f59e0b' viewBox='0 0 20 20'%3E%3Cpath d='M5 7l5 5 5-5'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 18px;
            cursor: pointer;
        }

        select option {
            background: var(--card);
            color: var(--text);
        }

        select:focus {
            outline: 3px solid rgba(34,197,94,0.25);
            border-color: var(--accent);
        }

        select option:checked {
            background: #22c55e !important;
            color: white !important;
        }

        select option:hover {
            background: #16a34a !important;
            color: white !important;
        }

        /* ============================================================
           БЛОК ЗАГРУЗКИ ФАЙЛОВ (DRAG & DROP)
        ============================================================ */
        .drop-zone {
            border: 3px dashed var(--border);
            border-radius: 25px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .drop-zone:hover {
            border-color: var(--accent);
            background: rgba(245,158,11,0.06);
        }

        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(245,158,11,0.12);
        }

        .upload-title {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .upload-subtitle {
            font-size: 18px;
            color: gray;
        }

        /* ============================================================
           СПИСОК ВЫБРАННЫХ ФАЙЛОВ
        ============================================================ */
        .file-list {
            margin-bottom: 20px;
        }

        .file-item {
            background: var(--input);
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 500px;
        }

        .remove-file {
            border: none;
            background: transparent;
            color: #ef4444;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .remove-file:hover {
            transform: scale(1.15);
        }

        /* ============================================================
           КНОПКА ОТПРАВКИ И ПРОГРЕСС-БАР
        ============================================================ */
        .submit-btn {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: var(--accent);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Прогресс внутри кнопки */
        .submit-btn::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: var(--progress, 0%);
            background: rgba(255,255,255,0.25);
            transition: width 0.2s;
        }

        .submit-btn.loading {
            opacity: 0.8;
            pointer-events: none;
        }

        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 3px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
           ИНФОРМАЦИОННЫЕ БЛОКИ (INFO, CONTENT FILES)
        ============================================================ */
        .info-box {
            width: 100%;
            margin-bottom: 25px;
            line-height: 1.7;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-line;
        }

        .info-box p {
            margin: 0 0 10px 0;
        }

        .info-box p:last-child {
            margin-bottom: 0;
        }

        .info-box a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        .info-box a:hover {
            text-decoration: underline;
        }

        .content-files {
            margin-top: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .content-file {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--input);
            border: 1px solid var(--border);
            transition: 0.15s;
        }

        .content-file:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
            background: rgba(34,197,94,0.08);
        }

        .content-file span {
            font-size: 13px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .content-file a {
            font-size: 12px;
            text-decoration: none;
            color: var(--accent);
            background: rgba(34,197,94,0.10);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .content-file a:hover {
            background: rgba(34,197,94,0.2);
        }

        /* ============================================================
           ФОРМА (линия сверху УДАЛЕНА)
        ============================================================ */
        form {
            margin-top: 20px;
            padding-top: 10px;
            /* border-top удалён — линия убрана */
        }

        /* ============================================================
           ДОПОЛНИТЕЛЬНЫЕ БЛОКИ
        ============================================================ */
        .upload-info {
            background: var(--input);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            animation: showMessage 0.3s ease;
        }

        .upload-info h3 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        .success-message {
            background: #22c55e;
            color: white;
            padding: 18px;
            border-radius: 16px;
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            animation: showMessage 0.4s ease;
        }

        @keyframes showMessage {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           РАЗДЕЛИТЕЛЬНАЯ ЛИНИЯ (СВЕРХУ, ПОСЛЕ ИНФОБЛОКОВ, ПЕРЕД SELECT)
        ============================================================ */
        .divider {
            margin: 15px 0 20px 0;
            border-top: 2px solid var(--border);
        }

        /* ============================================================
           ПОДСВЕТКА ОШИБОК И СООБЩЕНИЯ
        ============================================================ */
        input:invalid {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 2px rgba(239,68,68,0.2) !important;
        }

        .field-error {
            color: #ef4444;
            font-size: 13px;
            margin-top: -8px;
            margin-bottom: 12px;
        }

        /* ============================================================
           АДАПТИВНОСТЬ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ
        ============================================================ */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .container {
                width: 100%;
                padding: 25px;
                border-radius: 20px;
            }
            h1 {
                font-size: 28px;
            }
            .upload-title {
                font-size: 22px;
            }
            .theme-button {
                width: 50px;
                height: 50px;
            }
        }

        /* ============================================================
           ВСПОМОГАТЕЛЬНЫЕ СТИЛИ
        ============================================================ */
        input:-webkit-autofill,
        nput:-webkit-autofill:hover,
        nput:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--text);
            -webkit-box-shadow: 0 0 0px 1000px var(--input) inset;
            transition: background-color 9999s ease-in-out 0s;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Убрать синий фокус в браузере */
        input:focus,
        select:focus,
        textarea:focus {
            outline: none !important;
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.25) !important;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: "›";
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            font-size: 22px;
            color: var(--accent);
            pointer-events: none;
        }

        /* Для Firefox */
        select option:checked {
            background-color: #22c55e !important;
            color: white !important;
        }

        /* Для Safari */
        select option:active,
        select option:focus {
            background: #22c55e !important;
            color: white !important;
        }

        /* ============================================================
           ВЫДЕЛЕНИЕ ТЕКСТА ЗЕЛЁНЫМ
           ============================================================ */
        ::selection {
            background: #22c55e !important;
            color: white !important;
        }
        
        ::-moz-selection {
            background: #22c55e !important;
            color: white !important;
        }
        
        /* Для тёмной темы (опционально) */
        body.dark ::selection {
            background: #4ade80 !important;
            color: #1f2937 !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- ============================================================
             ВЕРХНЯЯ ПАНЕЛЬ
        ============================================================ -->
        <div class="top-bar">
            <h1>{{ title }}</h1>
            <button type="button" class="theme-button" onclick="toggleTheme()">
                <img src="{{ url_for('static', filename='theme.png') }}" class="theme-icon">
            </button>
        </div>

        <!-- ============================================================
             ИНФОРМАЦИОННЫЙ БЛОК (из content/info.txt)
        ============================================================ -->
        {% if info %}
        <div class="info-box">
            {{ info }}
        </div>
        {% endif %}

        <!-- ============================================================
             ФАЙЛЫ ДЛЯ СКАЧИВАНИЯ (из content/files)
        ============================================================ -->
        {% if content_files %}
        <div class="content-files">
            {% for file in content_files %}
            <div class="content-file compact">
                <span>{{ file.icon }} {{ file.name }}</span>
                <a href="{{ file.url }}">Скачать</a>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- ============================================================
             РАЗДЕЛИТЕЛЬНАЯ ЛИНИЯ (ТОЛЬКО СВЕРХУ, ПЕРЕД SELECT)
        ============================================================ -->
        <div class="divider"></div>

        <!-- ============================================================
             ФОРМА СДАЧИ РАБОТ
        ============================================================ -->
        <form method="POST" enctype="multipart/form-data">
            <!-- Выпадающий список тем -->
            <div class="select-wrapper">
                <select id="topicSelect" name="topic_select" required>
                    <option value="">{{ select_title }}</option>
                    {% for t in topics %}
                        <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                    <option value="Другое">Другое</option>
                </select>
            </div>

            <!-- Контейнер для динамических полей (группа, номер участника) -->
            <div id="dynamicFieldsContainer"></div>

            <!-- Поле для ручного ввода темы (появляется при выборе "Другое") -->
            <input type="text" id="customTopic" name="custom_topic" placeholder="Введите название новой темы" style="display: none;">

            <!-- Поле ФИО (изначально скрыто, появляется после выбора категории) -->
            <input type="text" id="fullNameField" name="full_name" placeholder="Например: Иванов Иван Иванович" required style="display: none;">

            <!-- Блок загрузки файлов (drag & drop) ВСЕГДА ВИДИМ -->
            <label class="drop-zone" id="dropZone">
                <input type="file" id="fileInput" name="files" hidden multiple>
                <div class="upload-title">Перетащите файлы сюда</div>
                <div class="upload-subtitle">или нажмите для выбора</div>
            </label>

            <!-- Список выбранных файлов -->
            <div class="file-list" id="fileList"></div>

            <!-- Информация о подготовленных файлах -->
            <div id="uploadInfo" class="upload-info" style="display:none;">
                <h3>Подготовлено к отправке</h3>
                <div id="filesCount"></div>
                <div id="filesSize"></div>
            </div>

            <!-- Кнопка отправки ВСЕГДА ВИДИМА -->
            <button type="submit" class="submit-btn" id="submitButton" disabled>
                <span id="buttonText">Выберите категорию</span>
            </button>
        </form>
    </div>

    <script>
        // ============================================================
        // 1. ТЁМНАЯ ТЕМА (сохраняется в localStorage)
        // ============================================================
        const body = document.body;
        const savedTheme = localStorage.getItem("theme");
            
        if (savedTheme === "dark") {
            body.classList.add("dark");
        }
        
        function toggleTheme() {
            body.classList.toggle("dark");
            if (body.classList.contains("dark")) {
                localStorage.setItem("theme", "dark");
            } else {
                localStorage.setItem("theme", "light");
            }
        }
        
        // ============================================================
        // 2. КОНФИГУРАЦИЯ ДИНАМИЧЕСКИХ ПОЛЕЙ ДЛЯ РАЗНЫХ КАТЕГОРИЙ
        // ============================================================
        const topicSelect = document.getElementById("topicSelect");
        const fullNameField = document.getElementById("fullNameField");
        const customTopic = document.getElementById("customTopic");
        const dynamicContainer = document.getElementById("dynamicFieldsContainer");
        
        // Конфигурация дополнительных полей (с проверкой формата группы)
        const topicFields = {
            "Экзамен":   { 
                fields: [{ 
                    name: "group", 
                    label: "Группа (формат М-26-5, ИС-24-1)", 
                    type: "text", 
                    required: true,
                    pattern: "^[А-ЯЁ]+-\\d{2}-\\d$",
                    errorMessage: "Неверный формат! Примеры: М-26-5, ИС-24-1, ОМД-25-2"
                }] 
            },
            "Экзамен-Зачёт":   { 
                fields: [{ 
                    name: "group", 
                    label: "Группа (формат М-26-5, ИС-24-1)", 
                    type: "text", 
                    required: true,
                    pattern: "^[А-ЯЁ]+-\\d{2}-\\d$",
                    errorMessage: "Неверный формат! Примеры: М-26-5, ИС-24-1, ОМД-25-2"
                }] 
            },
            "Экзамен-Зачет":   { 
                fields: [{ 
                    name: "group", 
                    label: "Группа (формат М-26-5, ИС-24-1)", 
                    type: "text", 
                    required: true,
                    pattern: "^[А-ЯЁ]+-\\d{2}-\\d$",
                    errorMessage: "Неверный формат! Примеры: М-26-5, ИС-24-1, ОМД-25-2"
                }] 
            },
            "Зачёт-Экзамен":   { 
                fields: [{ 
                    name: "group", 
                    label: "Группа (формат М-26-5, ИС-24-1)", 
                    type: "text", 
                    required: true,
                    pattern: "^[А-ЯЁ]+-\\d{2}-\\d$",
                    errorMessage: "Неверный формат! Примеры: М-26-5, ИС-24-1, ОМД-25-2"
                }] 
            },
            "Зачет-Экзамен":   { 
                fields: [{ 
                    name: "group", 
                    label: "Группа (формат М-26-5, ИС-24-1)", 
                    type: "text", 
                    required: true,
                    pattern: "^[А-ЯЁ]+-\\d{2}-\\d$",
                    errorMessage: "Неверный формат! Примеры: М-26-5, ИС-24-1, ОМД-25-2"
                }] 
            },
            "Зачёт":     { 
                fields: [{ 
                    name: "group", 
                    label: "Группа (формат М-26-5, ИС-24-1)", 
                    type: "text", 
                    required: true,
                    pattern: "^[А-ЯЁ]+-\\d{2}-\\d$",
                    errorMessage: "Неверный формат! Примеры: М-26-5, ИС-24-1, ОМД-25-2"
                }] 
            },
            "Зачет":     { 
                fields: [{ 
                    name: "group", 
                    label: "Группа (формат М-26-5, ИС-24-1)", 
                    type: "text", 
                    required: true,
                    pattern: "^[А-ЯЁ]+-\\d{2}-\\d$",
                    errorMessage: "Неверный формат! Примеры: М-26-5, ИС-24-1, ОМД-25-2"
                }] 
            },
            "Практика":  { 
                fields: [{ 
                    name: "group", 
                    label: "Группа (формат М-26-5, ИС-24-1)", 
                    type: "text", 
                    required: true,
                    pattern: "^[А-ЯЁ]+-\\d{2}-\\d$",
                    errorMessage: "Неверный формат! Примеры: М-26-5, ИС-24-1, ОМД-25-2"
                }] 
            },
            "Чемпионат": { 
                fields: [{ 
                    name: "participant_number", 
                    label: "Номер участника", 
                    type: "number", 
                    required: true 
                }] 
            },
            "Олимпиада": { fields: [] },
            "Проект":    { fields: [] }
        };
        
        function renderDynamicFields(topic) {
            dynamicContainer.innerHTML = "";
            const cfg = topicFields[topic];
            if (!cfg || !cfg.fields) return;
        
            cfg.fields.forEach(field => {
                let input;
                if (field.type === "number") {
                    input = document.createElement("input");
                    input.type = "number";
                    input.name = field.name;
                    input.placeholder = field.label;
                    input.required = field.required;
                    input.min = "1";
                } else {
                    input = document.createElement("input");
                    input.type = "text";
                    input.name = field.name;
                    input.placeholder = field.label;
                    input.required = field.required;
                    
                    // Добавляем проверку по регулярному выражению для группы
                    if (field.pattern) {
                        input.pattern = field.pattern;
                        input.title = field.errorMessage;
                        input.addEventListener("input", function() {
                            if (this.value && this.checkValidity()) {
                                this.style.borderColor = "#22c55e";
                                this.style.border = "2px solid #22c55e";
                                const errorDiv = this.parentElement.querySelector(".field-error");
                                if (errorDiv) errorDiv.remove();
                            } else if (this.value) {
                                this.style.borderColor = "#ef4444";
                                this.style.border = "2px solid #ef4444";
                                let errorDiv = this.parentElement.querySelector(".field-error");
                                if (!errorDiv) {
                                    errorDiv = document.createElement("div");
                                    errorDiv.className = "field-error";
                                    errorDiv.style.color = "#ef4444";
                                    errorDiv.style.fontSize = "13px";
                                    errorDiv.style.marginTop = "-8px";
                                    errorDiv.style.marginBottom = "12px";
                                    errorDiv.textContent = field.errorMessage;
                                    this.parentElement.appendChild(errorDiv);
                                }
                            }
                        });
                    }
                }
                
                input.style.width = "100%";
                input.style.padding = "18px";
                input.style.marginBottom = "12px";
                input.style.border = "2px solid var(--border)";
                input.style.borderRadius = "16px";
                input.style.background = "var(--input)";
                input.style.color = "var(--text)";
                
                const wrapper = document.createElement("div");
                wrapper.appendChild(input);
                dynamicContainer.appendChild(wrapper);
                
                input.addEventListener("input", checkForm);
            });
        }
        
        // ============================================================
        // 3. ОБРАБОТЧИК ИЗМЕНЕНИЯ ТЕМЫ
        // ============================================================
        topicSelect.addEventListener("change", () => {
            const val = topicSelect.value;
            
            if (!val || val === "") {
                fullNameField.style.display = "none";
                dynamicContainer.style.display = "none";
                customTopic.style.display = "none";
                customTopic.required = false;
                submitButton.disabled = true;
                buttonText.textContent = "Выберите категорию";
                return;
            }
            
            fullNameField.style.display = "block";
            dynamicContainer.style.display = "block";
            
            if (val === "Другое") {
                customTopic.style.display = "block";
                customTopic.required = true;
                dynamicContainer.style.display = "none";
            } else {
                customTopic.style.display = "none";
                customTopic.required = false;
                renderDynamicFields(val);
            }
            
            checkForm();
        });
        
        // ============================================================
        // 4. РАБОТА С ФАЙЛАМИ
        // ============================================================
        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");
        const fileList = document.getElementById("fileList");
        const uploadInfo = document.getElementById("uploadInfo");
        const filesCount = document.getElementById("filesCount");
        const filesSize = document.getElementById("filesSize");
        
        let selectedFiles = [];
        
        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("dragover");
        });
        
        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("dragover");
        });
        
        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZone.classList.remove("dragover");
            addFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener("change", (e) => {
            addFiles(e.target.files);
            fileInput.value = "";
        });
        
        function addFiles(files) {
            for (const file of files) {
                if (file.size === 0) continue;
                const exists = selectedFiles.some(f => f.name === file.name && f.size === file.size);
                if (!exists) {
                    selectedFiles.push(file);
                }
            }
            renderFiles();
        }
        
        function renderFiles() {
            fileList.innerHTML = "";
            let totalSize = 0;
        
            selectedFiles.forEach((file, index) => {
                totalSize += file.size;
                const div = document.createElement("div");
                div.className = "file-item";
                const fileName = document.createElement("span");
                const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                fileName.textContent = `📄 ${file.name} (${sizeMB} МБ)`;
            
                const removeButton = document.createElement("button");
                removeButton.className = "remove-file";
                removeButton.type = "button";
                removeButton.textContent = "✖";
                removeButton.onclick = () => {
                    selectedFiles.splice(index, 1);
                    renderFiles();
                    checkForm();
                };
            
                div.appendChild(fileName);
                div.appendChild(removeButton);
                fileList.appendChild(div);
            });
        
            if (selectedFiles.length > 0) {
                uploadInfo.style.display = "block";
                filesCount.textContent = "Файлов: " + selectedFiles.length;
                filesSize.textContent = "Размер: " + (totalSize / 1024 / 1024).toFixed(2) + " МБ";
            } else {
                uploadInfo.style.display = "none";
            }
            checkForm();
        }
        
        // ============================================================
        // 5. ОТПРАВКА ФОРМЫ
        // ============================================================
        const form = document.querySelector("form");
        const submitButton = document.getElementById("submitButton");
        const buttonText = document.getElementById("buttonText");
        let isSubmitting = false;
        
        form.addEventListener("submit", (e) => {
            e.preventDefault();
        
            if (isSubmitting) return;
        
            if (selectedFiles.length === 0) {
                alert("Выберите файлы");
                return;
            }
        
            // Проверка на пустые файлы
            const validFiles = selectedFiles.filter(f => f.size > 0);
            if (validFiles.length !== selectedFiles.length) {
                alert("Обнаружены пустые файлы. Пожалуйста, выберите файлы заново.");
                resetForm();
                return;
            }
        
            isSubmitting = true;
            submitButton.disabled = true;
        
            const formData = new FormData();
            
            if (fullNameField.style.display !== "none") {
                formData.append("full_name", fullNameField.value);
            }
            
            formData.append("topic_select", topicSelect.value);
            formData.append("custom_topic", customTopic.value);
        
            const dynamicInputs = dynamicContainer.querySelectorAll("input, select");
            dynamicInputs.forEach(input => {
                formData.append(input.name, input.value);
            });
        
            selectedFiles.forEach(file => {
                formData.append("files", file);
            });
        
            const xhr = new XMLHttpRequest();
            xhr.open("POST", "/", true);
        
            xhr.upload.onprogress = (e) => {
                if (!e.lengthComputable) return;
                const percent = Math.round((e.loaded / e.total) * 100);
                submitButton.style.setProperty("--progress", percent + "%");
                buttonText.textContent = `Отправка ${percent}%`;
            };
        
            xhr.onload = () => {
                isSubmitting = false;
                if (xhr.status === 200) {
                    submitButton.style.setProperty("--progress", "100%");
                    showSuccess();
                    resetForm();
                } else {
                    alert("Ошибка отправки");
                    submitButton.disabled = false;
                    buttonText.textContent = "Отправить работу";
                }
            };
        
            xhr.onerror = () => {
                isSubmitting = false;
                alert("Ошибка сети");
                submitButton.disabled = false;
                buttonText.textContent = "Отправить работу";
            };
        
            xhr.send(formData);
        });
        
        // ============================================================
        // 6. ВАЛИДАЦИЯ И АКТИВАЦИЯ КНОПКИ
        // ============================================================
        function checkForm() {
            if (isSubmitting) {
                submitButton.disabled = true;
                return;
            }
            
            const hasTopic = topicSelect.value !== "";
            
            if (!hasTopic || topicSelect.value === "") {
                submitButton.disabled = true;
                buttonText.textContent = "Выберите категорию";
                return;
            }
            
            let hasName = true;
            if (fullNameField.style.display !== "none") {
                hasName = fullNameField.value.trim() !== "";
            }
            
            let hasCustomTopic = true;
            if (topicSelect.value === "Другое") {
                hasCustomTopic = customTopic.value.trim() !== "";
            }
            
            let dynamicValid = true;
            const dynamicInputs = dynamicContainer.querySelectorAll("input, select");
            dynamicInputs.forEach(input => {
                if (input.hasAttribute("required") && !input.value.trim()) {
                    dynamicValid = false;
                }
                // Проверка на валидность по pattern
                if (input.pattern && input.value && !input.checkValidity()) {
                    dynamicValid = false;
                }
            });
            
            const hasFiles = selectedFiles.length > 0;
            
            if (hasName && hasCustomTopic && hasFiles && dynamicValid) {
                submitButton.disabled = false;
                buttonText.textContent = "Отправить работу";
            } else {
                submitButton.disabled = true;
                if (!hasFiles) buttonText.textContent = "Выберите файлы";
                else if (topicSelect.value === "Другое" && !hasCustomTopic) buttonText.textContent = "Введите название темы";
                else buttonText.textContent = "Заполните все поля";
            }
        }
        
        fullNameField.addEventListener("input", checkForm);
        customTopic.addEventListener("input", checkForm);
        topicSelect.addEventListener("change", checkForm);
        
        // ============================================================
        // 7. СБРОС ФОРМЫ (ПОЛНОСТЬЮ ОЧИЩАЕТ ВСЁ)
        // ============================================================
        function resetForm() {
            isSubmitting = false;
            
            topicSelect.value = "";
            
            fullNameField.value = "";
            customTopic.value = "";
            dynamicContainer.innerHTML = "";
            
            fullNameField.style.display = "none";
            dynamicContainer.style.display = "none";
            customTopic.style.display = "none";
            customTopic.required = false;
            
            // === ПОЛНАЯ ОЧИСТКА ФАЙЛОВ ===
            selectedFiles = [];
            fileInput.value = "";
            
            // Пересоздаём fileInput через DataTransfer
            const dt = new DataTransfer();
            fileInput.files = dt.files;
            
            renderFiles();
            
            submitButton.style.setProperty("--progress", "0%");
            submitButton.disabled = true;
            buttonText.textContent = "Выберите категорию";
            
            // Очищаем форму
            form.reset();
            
            console.log("Форма полностью очищена");
        }
        
        // ============================================================
        // 8. УВЕДОМЛЕНИЕ ОБ УСПЕХЕ
        // ============================================================
        function showSuccess() {
            const div = document.createElement("div");
            div.textContent = "✔ Файлы успешно отправлены";
        
            Object.assign(div.style, {
                position: "fixed",
                top: "20px",
                left: "50%",
                transform: "translateX(-50%)",
                background: "#22c55e",
                color: "white",
                padding: "14px 20px",
                borderRadius: "12px",
                boxShadow: "0 10px 30px rgba(0,0,0,0.25)",
                fontSize: "15px",
                zIndex: "9999",
                opacity: "0",
                transition: "0.3s"
            });
        
            document.body.appendChild(div);
            setTimeout(() => div.style.opacity = "1", 50);
            setTimeout(() => {
                div.style.opacity = "0";
                setTimeout(() => div.remove(), 300);
            }, 2500);
        }
        
        // ============================================================
        // 9. ИНИЦИАЛИЗАЦИЯ (скрываем поля, очищаем всё)
        // ============================================================
        fullNameField.style.display = "none";
        dynamicContainer.style.display = "none";
        customTopic.style.display = "none";
        submitButton.disabled = true;
        buttonText.textContent = "Выберите категорию";
        
        // Очищаем всё при загрузке страницы
        window.addEventListener('load', function() {
            resetForm();
            console.log("Страница загружена, все данные очищены");
        });
    </script>
</body>
</html>
